<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Blogs | GrowAiMark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-white">
    <nav class="py-6 px-12 flex justify-between items-center border-b border-white/5">
        <div class="text-2xl font-black tracking-tighter">Grow<span class="text-blue-500">AI</span>Mark</div>
        <a href="/" class="text-sm font-bold hover:text-blue-500 transition">← Back to Home</a>
    </nav>

    <div class="py-20 text-center">
        <h1 class="text-5xl font-black mb-4 uppercase italic">Marketing <span class="text-blue-500">Insights</span></h1>
        <p class="text-gray-400">Expert strategies and AI updates for your business growth.</p>
    </div>

    <section class="max-w-7xl mx-auto px-6 pb-24">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
            {% for blog in blogs %}
            <div class="bg-white/5 rounded-3xl overflow-hidden border border-white/10 hover:border-blue-500 transition duration-300">
                <img src="{{ blog.image_url }}" class="w-full h-56 object-cover" alt="{{ blog.title }}">
                <div class="p-8">
                    <span class="text-blue-500 text-xs font-bold uppercase">{{ blog.category }}</span>
                    <h2 class="text-2xl font-bold my-4">{{ blog.title }}</h2>
                    <p class="text-gray-400 text-sm mb-6">{{ blog.excerpt }}</p>
                    <div class="flex justify-between items-center pt-6 border-t border-white/5">
                        <span class="text-xs text-gray-500">{{ blog.date_posted|date:"M d, Y" }}</span>
                        <button class="bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold">Read More</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </section>
</body>
</html>
