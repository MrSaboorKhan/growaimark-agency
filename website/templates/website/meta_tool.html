<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Meta Generator | GrowAIMark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-white font-sans min-h-screen flex items-center justify-center px-6">

    <div class="max-w-xl w-full bg-white/5 border border-white/10 p-10 rounded-[2.5rem] backdrop-blur-xl shadow-2xl">
        <h1 class="text-3xl font-black mb-2">AI Meta <span class="text-blue-500">Generator</span></h1>
        <p class="text-gray-400 mb-10 text-sm">Enter your keyword for a 2026 trending SEO description.</p>

        <form method="POST" class="space-y-6 flex flex-col">
            {% csrf_token %}
            <input type="text" name="keyword" placeholder="e.g. Digital Marketing Agency" required
                   class="w-full bg-white/5 border border-white/10 rounded-xl px-6 py-4 focus:border-blue-500 outline-none transition text-white">

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-black transition text-white shadow-lg shadow-blue-500/20">
                GENERATE NOW
            </button>
        </form>

        {% if description %}
<div class="mt-10 p-10 bg-blue-500/5 border border-blue-500/20 rounded-[3rem] shadow-2xl animate-fade-in">
    <div class="flex justify-between items-center mb-6">
        <span class="text-blue-400 font-black text-[10px] uppercase tracking-[0.3em]">AI Engine v4.0 Response</span>
        <span class="text-green-500 font-bold text-[10px] uppercase">100% Unique</span>
    </div>

    <p class="text-white text-xl leading-relaxed font-medium italic border-l-4 border-blue-600 pl-6">
        {{ description }}
    </p>

    <div class="mt-8 flex gap-4">
        <button onclick="navigator.clipboard.writeText('{{ description }}')" class="bg-blue-600/20 hover:bg-blue-600 px-6 py-2 rounded-full text-[10px] font-bold transition">COPY RESULT</button>
    </div>
</div>
{% endif %}

        <div class="mt-8 text-center">
            <a href="/" class="text-gray-500 text-xs hover:text-white transition uppercase tracking-widest font-bold">← Back to Home</a>
        </div>
    </div>

</body>
</html>
