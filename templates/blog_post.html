<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Blog Post - GrowAIMark</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f9ff; }

        .navbar {
            position: fixed; top: 0; width: 100%; padding: 20px 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
            z-index: 1000; box-shadow: 0 2px 20px rgba(0,0,0,0.05);
        }
        .logo { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .nav-links { display: flex; gap: 40px; list-style: none; }
        .nav-links a { text-decoration: none; color: #333; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: #667eea; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 30px; border-radius: 50px; text-decoration: none; font-weight: 600; }

        .blog-post-container {
            max-width: 800px;
            margin: 120px auto 60px;
            padding: 0 20px;
        }
        .post-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .post-category {
            display: inline-block;
            background: #667eea10;
            color: #667eea;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .post-header h1 {
            font-size: 42px;
            color: #1a1a2e;
            margin-bottom: 20px;
            line-height: 1.3;
        }
        .post-meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            color: #666;
            font-size: 14px;
        }
        .post-image {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 300px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }
        .post-image i { font-size: 80px; color: white; }
        .post-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .post-content h2 {
            font-size: 28px;
            margin: 30px 0 15px;
            color: #1a1a2e;
        }
        .post-content h3 {
            font-size: 22px;
            margin: 25px 0 10px;
            color: #1a1a2e;
        }
        .post-content p {
            color: #444;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .post-content ul, .post-content ol {
            margin: 15px 0 20px 30px;
            color: #444;
        }
        .post-content li {
            margin-bottom: 8px;
        }
        .post-content a {
            color: #667eea;
            text-decoration: none;
        }
        .post-author {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 30px;
            background: #f8f9ff;
            border-radius: 20px;
            margin-top: 40px;
        }
        .post-author img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .author-info h4 { font-size: 18px; margin-bottom: 5px; }
        .author-info p { color: #666; margin: 0; }

        .comments-section {
            margin-top: 40px;
            background: white;
            padding: 30px;
            border-radius: 20px;
        }
        .comment-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin: 10px 0;
            font-family: inherit;
        }
        .comment-form button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
        }

        .footer { background: #1a1a2e; color: white; padding: 60px 5% 30px; margin-top: 60px; }
        .footer-content { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; max-width: 1200px; margin: 0 auto; }
        .footer-col h4 { margin-bottom: 20px; }
        .footer-col p, .footer-col a { color: #aaa; text-decoration: none; line-height: 2; display: block; }
        .footer-bottom { text-align: center; padding-top: 40px; margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); }

        @media (max-width: 768px) {
            .post-header h1 { font-size: 32px; }
            .post-content { padding: 25px; }
            .nav-links { display: none; }
            .footer-content { grid-template-columns: 1fr; }
        }
        .mobile-menu { display: none; font-size: 24px; cursor: pointer; }
        @media (max-width: 768px) { .mobile-menu { display: block; } }
        .loading { text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo"><span>Grow</span>AI<span>Mark</span></a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/portfolio">Portfolio</a></li>
            <li><a href="/blog">Blog</a></li>
            <li><a href="/dashboard">Tools</a></li>
            <li><a href="/about">About</a></li>
        </ul>
        <a href="/#contact" class="btn-primary">Get in Touch</a>
        <div class="mobile-menu"><i class="fas fa-bars"></i></div>
    </nav>

    <div class="blog-post-container" id="post-container">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading post...</div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-col"><h4>GrowAIMark</h4><p>Digital marketing blog by H.M. Saboor Khan</p></div>
            <div class="footer-col"><h4>Quick Links</h4><a href="/">Home</a><a href="/portfolio">Portfolio</a><a href="/blog">Blog</a></div>
            <div class="footer-col"><h4>Contact</h4><p>saboor@growaimark.com</p><p>+92 303 0001026</p></div>
        </div>
        <div class="footer-bottom"><p>&copy; 2024 H.M. Saboor Khan - GrowAIMark</p></div>
    </footer>

    <script>
        const slug = window.location.pathname.split('/').pop();

        async function loadPost() {
            try {
                const response = await fetch(`/api/blog/post/${slug}`);
                const post = await response.json();

                if (!post || !post.title) {
                    document.getElementById('post-container').innerHTML = '<div style="text-align:center;padding:50px;"><h2>Post not found</h2><a href="/blog">← Back to Blog</a></div>';
                    return;
                }

                document.title = `${post.title} - GrowAIMark Blog`;

                document.getElementById('post-container').innerHTML = `
                    <div class="post-header">
                        <span class="post-category">${post.category}</span>
                        <h1>${post.title}</h1>
                        <div class="post-meta">
                            <span><i class="far fa-calendar"></i> ${post.date}</span>
                            <span><i class="far fa-clock"></i> ${post.read_time}</span>
                        </div>
                    </div>
                    <div class="post-image">
                        <i class="fas fa-${post.image || 'newspaper'}"></i>
                    </div>
                    <div class="post-content">
                        ${post.content}
                    </div>
                    <div class="post-author">
                        <div class="author-image" style="width:80px;height:80px;background:#667eea;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:32px;">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="author-info">
                            <h4>${post.author}</h4>
                            <p>Digital Marketing Expert & AI Strategist. Helping businesses grow with data-driven marketing.</p>
                        </div>
                    </div>
                    <div class="comments-section">
                        <h3>💬 Leave a Comment</h3>
                        <form class="comment-form" id="commentForm">
                            <textarea id="commentText" rows="4" placeholder="Share your thoughts..."></textarea>
                            <button type="submit">Post Comment</button>
                        </form>
                        <div id="commentsList" style="margin-top: 30px;">
                            ${post.comments && post.comments.length > 0 ?
                                `<h4>Comments (${post.comments.length})</h4>` +
                                post.comments.map(c => `<div style="padding:15px;border-bottom:1px solid #eee;"><strong>${c.name}</strong><p style="margin-top:5px;color:#666;">${c.text}</p></div>`).join('')
                                : '<p>No comments yet. Be the first!</p>'}
                        </div>
                    </div>
                `;

                document.getElementById('commentForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const text = document.getElementById('commentText').value;
                    if (!text.trim()) return;

                    const response = await fetch(`/api/blog/post/${slug}/comment`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name: 'Reader', text: text})
                    });

                    if (response.ok) {
                        document.getElementById('commentText').value = '';
                        loadPost(); // Reload to show new comment
                    }
                });

            } catch (error) {
                console.error('Error loading post:', error);
                document.getElementById('post-container').innerHTML = '<div style="text-align:center;padding:50px;"><h2>Error loading post</h2><a href="/blog">← Back to Blog</a></div>';
            }
        }

        loadPost();

        const mobileBtn = document.querySelector('.mobile-menu');
        const navLinks = document.querySelector('.nav-links');
        if(mobileBtn) mobileBtn.addEventListener('click', () => navLinks.classList.toggle('show'));
    </script>
</body>
</html>
